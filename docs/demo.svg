<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 583" width="880" height="583" role="img" aria-label="Tendril timing the SQL and HTTP requests of a running Spring Boot application">
<style>
text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:#c9d1d9;opacity:0}
.cmd{fill:#f0f6fc;font-weight:bold}.hook{fill:#7ee787}
@keyframes l0{0%,0.00%{opacity:0}0.01%,100%{opacity:1}}.l0{animation:l0 19.9s linear infinite}@keyframes l1{0%,6.28%{opacity:0}6.29%,100%{opacity:1}}.l1{animation:l1 19.9s linear infinite}@keyframes l2{0%,12.31%{opacity:0}12.32%,100%{opacity:1}}.l2{animation:l2 19.9s linear infinite}@keyframes l3{0%,13.57%{opacity:0}13.58%,100%{opacity:1}}.l3{animation:l3 19.9s linear infinite}@keyframes l4{0%,19.85%{opacity:0}19.86%,100%{opacity:1}}.l4{animation:l4 19.9s linear infinite}@keyframes l5{0%,21.10%{opacity:0}21.11%,100%{opacity:1}}.l5{animation:l5 19.9s linear infinite}@keyframes l6{0%,23.12%{opacity:0}23.13%,100%{opacity:1}}.l6{animation:l6 19.9s linear infinite}@keyframes l7{0%,29.40%{opacity:0}29.41%,100%{opacity:1}}.l7{animation:l7 19.9s linear infinite}@keyframes l8{0%,30.65%{opacity:0}30.66%,100%{opacity:1}}.l8{animation:l8 19.9s linear infinite}@keyframes l9{0%,31.91%{opacity:0}31.92%,100%{opacity:1}}.l9{animation:l9 19.9s linear infinite}@keyframes l10{0%,38.19%{opacity:0}38.20%,100%{opacity:1}}.l10{animation:l10 19.9s linear infinite}@keyframes l11{0%,39.45%{opacity:0}39.46%,100%{opacity:1}}.l11{animation:l11 19.9s linear infinite}@keyframes l12{0%,40.70%{opacity:0}40.71%,100%{opacity:1}}.l12{animation:l12 19.9s linear infinite}@keyframes l13{0%,41.96%{opacity:0}41.97%,100%{opacity:1}}.l13{animation:l13 19.9s linear infinite}@keyframes l14{0%,43.97%{opacity:0}43.98%,100%{opacity:1}}.l14{animation:l14 19.9s linear infinite}@keyframes l15{0%,50.25%{opacity:0}50.26%,100%{opacity:1}}.l15{animation:l15 19.9s linear infinite}@keyframes l16{0%,51.51%{opacity:0}51.52%,100%{opacity:1}}.l16{animation:l16 19.9s linear infinite}@keyframes l17{0%,52.77%{opacity:0}52.78%,100%{opacity:1}}.l17{animation:l17 19.9s linear infinite}@keyframes l18{0%,54.02%{opacity:0}54.03%,100%{opacity:1}}.l18{animation:l18 19.9s linear infinite}@keyframes l19{0%,55.28%{opacity:0}55.29%,100%{opacity:1}}.l19{animation:l19 19.9s linear infinite}@keyframes l20{0%,56.53%{opacity:0}56.54%,100%{opacity:1}}.l20{animation:l20 19.9s linear infinite}@keyframes l21{0%,58.55%{opacity:0}58.56%,100%{opacity:1}}.l21{animation:l21 19.9s linear infinite}@keyframes l22{0%,64.83%{opacity:0}64.84%,100%{opacity:1}}.l22{animation:l22 19.9s linear infinite}@keyframes l23{0%,66.09%{opacity:0}66.10%,100%{opacity:1}}.l23{animation:l23 19.9s linear infinite}@keyframes l24{0%,67.34%{opacity:0}67.35%,100%{opacity:1}}.l24{animation:l24 19.9s linear infinite}@keyframes l25{0%,73.62%{opacity:0}73.63%,100%{opacity:1}}.l25{animation:l25 19.9s linear infinite}@keyframes l26{0%,74.88%{opacity:0}74.89%,100%{opacity:1}}.l26{animation:l26 19.9s linear infinite}
</style>
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
<circle cx="24" cy="22" r="6" fill="#ff5f56"/><circle cx="44" cy="22" r="6" fill="#ffbd2e"/><circle cx="64" cy="22" r="6" fill="#27c93f"/>
<text x="18" y="66" class="l0 out" xml:space="preserve"></text>
<text x="18" y="85" class="l1 cmd" xml:space="preserve">$ java -jar app.jar &amp;</text>
<text x="18" y="104" class="l2 out" xml:space="preserve">(Spring Boot is up, pid 9574)</text>
<text x="18" y="123" class="l3 out" xml:space="preserve"></text>
<text x="18" y="142" class="l4 cmd" xml:space="preserve">$ curl localhost:8089/orders/ada</text>
<text x="18" y="161" class="l5 out" xml:space="preserve">[{&quot;ID&quot;:1,&quot;ITEM&quot;:&quot;keyboard&quot;,&quot;PRICE&quot;:80},{&quot;ID&quot;:2,&quot;ITEM&quot;:&quot;monitor&quot;,&quot;PRICE&quot;:240}]</text>
<text x="18" y="180" class="l6 out" xml:space="preserve"></text>
<text x="18" y="199" class="l7 cmd" xml:space="preserve">$ java -jar tendril-agent-all.jar attach 9574 --hooks timing.Timing --classpath hooks.jar</text>
<text x="18" y="218" class="l8 out" xml:space="preserve">Hooks from timing.Timing installed in JVM 9574</text>
<text x="18" y="237" class="l9 out" xml:space="preserve"></text>
<text x="18" y="256" class="l10 cmd" xml:space="preserve">$ curl localhost:8089/orders/ada</text>
<text x="18" y="275" class="l11 hook" xml:space="preserve">[tendril]   sql    0.21 ms  SELECT id, item, price FROM orders WHERE customer = ? ORDER BY id</text>
<text x="18" y="294" class="l12 hook" xml:space="preserve">[tendril] http    2.96 ms  GET /orders/ada</text>
<text x="18" y="313" class="l13 out" xml:space="preserve">[{&quot;ID&quot;:1,&quot;ITEM&quot;:&quot;keyboard&quot;,&quot;PRICE&quot;:80},{&quot;ID&quot;:2,&quot;ITEM&quot;:&quot;monitor&quot;,&quot;PRICE&quot;:240}]</text>
<text x="18" y="332" class="l14 out" xml:space="preserve"></text>
<text x="18" y="351" class="l15 cmd" xml:space="preserve">$ curl localhost:8089/report</text>
<text x="18" y="370" class="l16 hook" xml:space="preserve">[tendril]   sql    0.16 ms  SELECT COUNT(*) FROM orders WHERE price &gt; ?</text>
<text x="18" y="389" class="l17 hook" xml:space="preserve">[tendril]   sql    0.22 ms  SELECT SUM(price) FROM orders WHERE price &gt; ?</text>
<text x="18" y="408" class="l18 hook" xml:space="preserve">[tendril]   sql    0.25 ms  UPDATE stats SET reports = reports + ?</text>
<text x="18" y="427" class="l19 hook" xml:space="preserve">[tendril] http    2.15 ms  GET /report</text>
<text x="18" y="446" class="l20 out" xml:space="preserve">{&quot;orders&quot;:3,&quot;revenue&quot;:1520}</text>
<text x="18" y="465" class="l21 out" xml:space="preserve"></text>
<text x="18" y="484" class="l22 cmd" xml:space="preserve">$ java -jar tendril-agent-all.jar detach 9574</text>
<text x="18" y="503" class="l23 out" xml:space="preserve">All Tendril hooks removed from JVM 9574</text>
<text x="18" y="522" class="l24 out" xml:space="preserve"></text>
<text x="18" y="541" class="l25 cmd" xml:space="preserve">$ curl localhost:8089/orders/ada</text>
<text x="18" y="560" class="l26 out" xml:space="preserve">[{&quot;ID&quot;:1,&quot;ITEM&quot;:&quot;keyboard&quot;,&quot;PRICE&quot;:80},{&quot;ID&quot;:2,&quot;ITEM&quot;:&quot;monitor&quot;,&quot;PRICE&quot;:240}]</text>
</svg>
